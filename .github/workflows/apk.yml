name: APK

# Builds a debug APK on every push to master and keeps the newest 7 as downloadable artifacts
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # Deleting older APK artifacts
  actions: write

concurrency:
  group: apk
  cancel-in-progress: false

env:
  KEEP: 7

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Without a fixed key every build is signed differently, and installing it over the
      # previous one would mean uninstalling first (losing keys and settings)
      - name: Use the shared debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        if: env.DEBUG_KEYSTORE != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: ./gradlew assembleDebug

      - name: Name the APK
        id: apk
        run: |
          name="thumbs-${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.name }}
          # Uploaded as the bare .apk, so it downloads without a zip around it
          archive: false
          retention-days: 90

      - name: Delete all but the newest ${{ env.KEEP }} APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | test("^thumbs-.*\\.apk$")) | select(.expired | not) | [.created_at, .id] | @tsv' \
            | sort -r | tail -n +$((KEEP + 1)) | cut -f2 \
            | while read -r id; do
                echo "Deleting artifact $id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
              done

      - name: Summary
        run: echo "Built **${{ steps.apk.outputs.name }}**, downloadable under Artifacts below" >> "$GITHUB_STEP_SUMMARY"
